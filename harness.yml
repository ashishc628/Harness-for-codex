version: 1
name: harness-for-codex
description: Language-agnostic Codex harness with AGENTS.md, automation scripts, task templates, and verification workflows.

commands:
  bootstrap: scripts/bootstrap
  check: scripts/check
  test: scripts/test
  eval: scripts/eval
  doctor: scripts/doctor
  hooks: scripts/hooks
  surface: scripts/surface
  selftest: scripts/selftest

documents:
  agent_instructions: AGENTS.md
  claude_bridge: CLAUDE.md
  workflow: docs/workflow.md
  decisions: docs/decisions.md
  references: docs/references.md
  contributing: CONTRIBUTING.md
  changelog: CHANGELOG.md
  task_template: tasks/TEMPLATE.md
  surfaces: docs/surfaces.md
  surfaces_example: surfaces.example.yml
  devcontainer: .devcontainer/devcontainer.json
  pre_commit: .pre-commit-config.yaml

task_loop:
  - target
  - inspect
  - plan
  - implement
  - verify
  - handoff

verification:
  default: scripts/check
  handoff: scripts/eval
  surface: scripts/surface check

surfaces:
  config: surfaces.yml
  example: surfaces.example.yml
  optional: true
  env: SURFACE
  containment: scripts/surface check
  deploy: scripts/surface run
  confirmation: scripts/surface confirm

compatibility:
  codex: AGENTS.md
  cursor: AGENTS.md
  claude_code: CLAUDE.md
